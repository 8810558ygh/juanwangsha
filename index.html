<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卷王殺 </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #0a0a0a;
            overflow-x: hidden;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        .orbitron {
            font-family: 'Orbitron', monospace;
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(59, 130, 246, 0.8),
                0 0 20px rgba(59, 130, 246, 0.4),
                0 0 30px rgba(59, 130, 246, 0.2),
                0 0 50px rgba(139, 92, 246, 0.3);
        }

        .neon-text-gold {
            text-shadow:
                0 0 10px rgba(251, 191, 36, 0.8),
                0 0 20px rgba(251, 191, 36, 0.4),
                0 0 30px rgba(251, 150, 20, 0.3),
                0 0 50px rgba(251, 191, 36, 0.2);
        }

        .neon-border {
            box-shadow:
                0 0 20px rgba(59, 130, 246, 0.5),
                inset 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .neon-border-gold {
            box-shadow:
                0 0 20px rgba(251, 191, 36, 0.5),
                inset 0 0 20px rgba(251, 191, 36, 0.1);
        }

        .glass-panel {
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .scanline {
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.15) 50%,
                    rgba(0, 0, 0, 0.15) 100%);
            background-size: 100% 4px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0.25;
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0;
            background-attachment: fixed;
        }

        .cyber-btn {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .cyber-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .cyber-btn:hover::before {
            transform: translateX(100%);
        }
        .cyber-btn:hover {
            transform: translateY(-3px);
        }
        .cyber-btn:active {
            transform: translateY(0);
            transition: transform 0.1s;
        }

        .cyber-btn-multi {
            background: linear-gradient(135deg, #1e3a5f 0%, #1a1a3e 50%, #0d1b3e 100%);
            border: 2px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2), 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .cyber-btn-multi:hover {
            border-color: rgba(59, 130, 246, 0.9);
            box-shadow:
                0 0 50px rgba(59, 130, 246, 0.45),
                0 0 80px rgba(139, 92, 246, 0.25),
                0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .cyber-btn-single {
            background: linear-gradient(135deg, #3d2a0a 0%, #2a1a05 50%, #1a0f02 100%);
            border: 2px solid rgba(251, 191, 36, 0.45);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.15), 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .cyber-btn-single:hover {
            border-color: rgba(251, 191, 36, 0.85);
            box-shadow:
                0 0 50px rgba(251, 191, 36, 0.4),
                0 0 80px rgba(251, 150, 20, 0.2),
                0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.35);
            opacity: 0;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-18px);
            }
        }
        .floating {
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%,
            100% {
                text-shadow: 0 0 15px rgba(59, 130, 246, 0.7), 0 0 30px rgba(59, 130, 246, 0.35), 0 0 50px rgba(139, 92, 246, 0.25);
            }
            50% {
                text-shadow: 0 0 25px rgba(59, 130, 246, 1), 0 0 50px rgba(59, 130, 246, 0.6), 0 0 80px rgba(139, 92, 246, 0.45), 0 0 100px rgba(168, 85, 247, 0.2);
            }
        }
        .title-pulse {
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%,
            100% {
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.4), inset 0 0 15px rgba(59, 130, 246, 0.05);
            }
            50% {
                box-shadow: 0 0 35px rgba(59, 130, 246, 0.7), inset 0 0 30px rgba(59, 130, 246, 0.12);
            }
        }
        .border-glow {
            animation: borderGlow 3s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .title-main {
                font-size: 2.8rem;
            }
            .title-sub {
                font-size: 1rem;
            }
            .btn-container {
                gap: 1.25rem;
            }
            .btn-inner-icon {
                font-size: 3rem;
            }
            .btn-inner-title {
                font-size: 1.2rem;
            }
            .btn-inner-desc {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .title-main {
                font-size: 2.2rem;
                letter-spacing: 0.05em;
            }
            .title-sub {
                font-size: 0.85rem;
                letter-spacing: 0.15em;
            }
            .btn-inner-icon {
                font-size: 2.4rem;
            }
            .btn-inner-title {
                font-size: 1.05rem;
            }
            .btn-inner-desc {
                font-size: 0.7rem;
            }
            .btn-inner {
                padding: 1.25rem 1rem;
            }
        }
    </style>
</head>
<body class="min-h-screen grid-bg relative flex flex-col items-center justify-center px-4 py-8">

    <div class="scanline"></div>

    <div class="container relative z-10 flex flex-col items-center justify-center gap-8 md:gap-10 max-w-3xl mx-auto">

        <header class="text-center floating">
            <h1 class="orbitron title-main text-5xl md:text-6xl lg:text-7xl font-black mb-3 title-pulse text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 neon-text"
                style="line-height: 1.15;">
                卷王殺
            </h1>
            <p class="title-sub text-gray-400 text-base md:text-lg tracking-widest uppercase orbitron"
            style="letter-spacing: 0.3em;">
                胜负未定 · 卷无止境
            </p>
            <div class="mt-5 flex items-center justify-center gap-3">
                <span class="w-10 h-px bg-gradient-to-r from-transparent via-blue-500/60 to-transparent"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-blue-500 shadow-lg shadow-blue-500/60"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-purple-500 shadow-lg shadow-purple-500/60"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-pink-500 shadow-lg shadow-pink-500/60"></span>
                <span class="w-10 h-px bg-gradient-to-r from-transparent via-purple-500/60 to-transparent"></span>
            </div>
        </header>

        <div class="btn-container flex flex-col md:flex-row gap-5 md:gap-7 w-full max-w-2xl"
        id="btnContainer">

        <button onclick="goToSinglePlayer()"
        class="cyber-btn cyber-btn-single rounded-3xl w-full group relative"
        id="btnSingle">
        <div class="btn-inner relative z-10 flex flex-col items-center text-center px-6 py-7 md:py-9 gap-3 md:gap-4">
            <span class="btn-inner-icon text-5xl md:text-6xl transition-transform duration-300 group-hover:scale-110">🤖</span>
            <h3 class="btn-inner-title text-xl md:text-2xl font-bold text-yellow-300 neon-text-gold orbitron tracking-wider">
                单人游戏
            </h3>
            <p class="btn-inner-desc text-yellow-500/70 text-xs md:text-sm tracking-wide">
                独自挑战AI · 磨练卷技
            </p>
            <span class="text-[10px] text-yellow-600/50 uppercase tracking-widest mt-1">即将推出</span>
        </div>
    </button>

    <button onclick="goToMultiPlayer()"
    class="cyber-btn cyber-btn-multi rounded-3xl w-full group relative"
    id="btnMulti">
    <div class="btn-inner relative z-10 flex flex-col items-center text-center px-6 py-7 md:py-9 gap-3 md:gap-4">
        <span class="btn-inner-icon text-5xl md:text-6xl transition-transform duration-300 group-hover:scale-110">🌐</span>
        <h3 class="btn-inner-title text-xl md:text-2xl font-bold text-blue-300 neon-text orbitron tracking-wider">
            多人联机
        </h3>
        <p class="btn-inner-desc text-blue-400/70 text-xs md:text-sm tracking-wide">
            P2P对战 · 与好友一决高下
        </p>
        <span class="text-[10px] text-blue-400/50 uppercase tracking-widest mt-1">点击进入</span>
    </div>
</button>
</div>

<div class="flex items-center justify-center gap-5 text-xs text-gray-600 flex-wrap"
style="letter-spacing: 0.08em;">
<span class="flex items-center gap-1.5">
    <span class="w-1.5 h-1.5 rounded-full bg-green-500/70 shadow-sm shadow-green-500/40"></span>
    端到端加密
</span>
<span class="flex items-center gap-1.5">
    <span class="w-1.5 h-1.5 rounded-full bg-blue-500/70 shadow-sm shadow-blue-500/40"></span>
    支持私聊
</span>
<span class="flex items-center gap-1.5">
    <span class="w-1.5 h-1.5 rounded-full bg-yellow-500/70 shadow-sm shadow-yellow-500/40"></span>
    回合制对战
</span>
<span class="flex items-center gap-1.5">
    <span class="w-1.5 h-1.5 rounded-full bg-purple-500/70 shadow-sm shadow-purple-500/40"></span>
    最多8人
</span>
</div>
</div>

<div id="toast"
class="fixed bottom-8 left-1/2 transform -translate-x-1/2 glass-panel border border-yellow-500/40 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2 whitespace-nowrap">
<span id="toastIcon">💡</span><span id="toastMessage">提示</span>
</div>

<script>
    function showToast(message, icon = '💡', duration = 2800) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = message;
        document.getElementById('toastIcon').textContent = icon;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.add('opacity-0', 'pointer-events-none');
            toast.classList.remove('opacity-100');
        }, duration);
    }

    function goToSinglePlayer() {
        showToast('单人模式正在开发中，敬请期待！', '🔧', 3000);
        const btn = document.getElementById('btnSingle');
        gsap.fromTo(btn, { scale: 1 }, { scale: 0.96, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.inOut" });
    }

    function goToMultiPlayer() {
        const btn = document.getElementById('btnMulti');
        gsap.fromTo(btn, { scale: 1 }, { scale: 0.94, duration: 0.12, ease: "power2.in" });
        setTimeout(() => {
            window.location.href = 'multipleplay.html';
        }, 200);
    }

    function createParticle() {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = 2 + Math.random() * 4;
        const colors = [
            'rgba(59,130,246,0.4)',
            'rgba(139,92,246,0.35)',
            'rgba(168,85,247,0.3)',
            'rgba(59,130,246,0.25)',
        ];
        const color = colors[Math.floor(Math.random() * colors.length)];
        particle.style.cssText = `
                width:${size}px;
                height:${size}px;
                background:${color};
                border-radius:50%;
                position:fixed;
                pointer-events:none;
                z-index:0;
                left:${Math.random() * 100}%;
                top:105%;
                opacity:0;
            `;
        document.body.appendChild(particle);
        gsap.to(particle, {
            y: -window.innerHeight - 150,
            x: (Math.random() - 0.5) * 120,
            opacity: 0.7,
            duration: 7 + Math.random() * 6,
            ease: "none",
            onComplete: () => {
                if (particle.parentNode) particle.parentNode.removeChild(particle);
            }
        });
        gsap.to(particle, {
            opacity: 0,
            duration: 2,
            delay: 5 + Math.random() * 4,
            ease: "power2.out"
        });
    }

    function initParticles() {
        setInterval(() => {
            if (document.hidden) return;
            createParticle();
        }, 700);
        for (let i = 0; i < 10; i++) {
            setTimeout(() => createParticle(), i * 250);
        }
    }

    function initEntranceAnimation() {
        const tl = gsap.timeline();
        tl.fromTo('header',
            { opacity: 0, y: -30, scale: 0.92 },
            { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.6)" }
        );
        tl.fromTo('#btnSingle',
            { opacity: 0, x: -40, scale: 0.9 },
            { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" },
            "-=0.3"
        );
        tl.fromTo('#btnMulti',
            { opacity: 0, x: 40, scale: 0.9 },
            { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" },
            "-=0.45"
        );
        tl.fromTo('.border-glow',
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "power2.out" },
            "-=0.2"
        );
    }

    function init() {
        initParticles();
        initEntranceAnimation();

        document.addEventListener('keydown', function(e) {
            if (e.key === '1' || e.key === '!') {
                goToSinglePlayer();
            } else if (e.key === '2' || e.key === '@') {
                goToMultiPlayer();
            }
        });
    }

    window.addEventListener('DOMContentLoaded', init);

    window.addEventListener('resize', () => {
        document.querySelectorAll('.particle').forEach(p => {
            const top = parseFloat(p.style.top);
            if (top < -200) {
                if (p.parentNode) p.parentNode.removeChild(p);
            }
        });
    });

    window.onbeforeunload = null;
</script>
</body>
</html>
